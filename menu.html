<!DOCTYPE html>
<html lang="it">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Menu completo del MEMPHIS① di Mercenasco."
    >

    <title>Menu | MEMPHIS①</title>

    <link rel="stylesheet" href="css/style.css">

</head>


<body>

<header class="site-header">

    <div class="container header-inner">

        <a href="index.html" class="logo">
            <img
                src="images/logo.png"
                alt="MEMPHIS①"
            >
        </a>

        <a
            href="index.html"
            class="header-menu-btn"
        >
            Torna al sito
        </a>

    </div>

</header>


<main>

    <section class="section menu-page">

        <div class="container">

            <div class="menu-page-header">

                <span class="eyebrow">
                    MEMPHIS①
                </span>

                <h1>
                    Il nostro menu
                </h1>

                <p>
                    Scopri tutte le proposte della cucina,
                    le birre e i drink del MEMPHIS①.
                </p>

            </div>


            <div data-menu="full">

                <!--
                    Il menu completo viene caricato
                    automaticamente da menu.json.
                -->

            </div>


            <div class="menu-note">
                <p data-menu-note></p>
            </div>

        </div>

    </section>

</main>


<footer class="site-footer">

    <div class="container footer-inner">

        <div class="footer-brand-info">

            <img
                src="images/logo.png"
                alt="MEMPHIS①"
            >

            <p>
                MEMPHIS①
            </p>

            <p>
                Via Roma, 17 · Mercenasco (TO)
            </p>

        </div>

        <div class="footer-links">

            <a href="index.html">
                Home
            </a>

            <a href="index.html#eventi">
                Eventi
            </a>

            <a href="index.html#contatti">
                Dove siamo
            </a>

        </div>

        <p class="copyright">
            © 2026 MEMPHIS① ·
            Realizzato da
            <a
                href="https://denisneacsu.com"
                target="_blank"
                rel="noopener"
            >
                denisneacsu.com
            </a>
        </p>

    </div>

</footer>

<script src="js/menu.js"></script>

</body>

</html>
